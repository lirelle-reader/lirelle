# Completes release-please's pull request with what the stores read in the tagged commit: the release's versionCode
# (F-Droid's update check) and its changelog (F-Droid and Google Play). Runs on each push to release-please's branch,
# commits as the app lirelle-release so that the required checks run again on the new head; its own push then changes
# nothing, which ends it.
name: Release PR

on:
  push:
    branches: [release-please--branches--main]

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The app's credentials as repository secrets: the environment release only lets main in. Workflows of pull
      # requests from forks never see them.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: main, as the versionCode counts it
        run: git fetch -q origin main:refs/remotes/origin/main
      - name: versionCode and changelog
        run: ci/complete-release-pr.py
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Up to date"
            exit 0
          fi
          git config user.name 'lirelle-release[bot]'
          git config user.email '360776979+lirelle-release[bot]@users.noreply.github.com'
          git add gradle.properties fastlane/metadata/android/en-US/changelogs
          git commit -m "chore: the release's versionCode and changelog"
          git push
