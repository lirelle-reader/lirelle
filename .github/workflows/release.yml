# On every push to main: the checks, then release-please (its release PR, or the release when that PR is merged),
# then the signed APK: on the release, or as a development pre-release.
name: Release

on:
  push:
    branches: [main]

# One at a time, never cancelled: a build must not be dropped because another merge followed.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  release-please:
    needs: checks
    runs-on: ubuntu-latest
    # The app's key is kept there, with the signing secrets.
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The app's token, not the workflow's: a pull request opened with the workflow's token starts no workflow, so
      # the release PR would never get the checks main requires.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Whole history
        # The versionCode counts main's commits: a shallow clone would make a wrong one.
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - uses: ./.github/actions/android-build
      - name: Signed APK
        env:
          LIRELLE_KEYSTORE_B64: ${{ secrets.LIRELLE_KEYSTORE_B64 }}
          LIRELLE_KEYSTORE_PASSWORD: ${{ secrets.LIRELLE_KEYSTORE_PASSWORD }}
          LIRELLE_KEY_ALIAS: ${{ secrets.LIRELLE_KEY_ALIAS }}
          LIRELLE_KEY_PASSWORD: ${{ secrets.LIRELLE_KEY_PASSWORD }}
        run: |
          echo "$LIRELLE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export LIRELLE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # Never from the build cache: a cached output of a library once gave a release an older module.
          ./gradlew :app:assembleRelease --no-build-cache
      - name: versionCode as written in the release PR
        # F-Droid reads lirelle.versionCode in the tagged commit; the build counts commits. They differ when a pull
        # request was merged just before the release PR, before release-please could update it: nothing goes out.
        if: needs.release-please.outputs.release_created == 'true'
        run: |
          built=$("$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)" dump badging \
            app/build/outputs/apk/release/app-release.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          written=$(sed -n 's/^lirelle\.versionCode=//p' gradle.properties)
          echo "built $built, written $written"
          test "$built" = "$written"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: ci/publish-github.sh
      - name: AAB, signed with the upload key
        if: needs.release-please.outputs.release_created == 'true'
        env:
          LIRELLE_UPLOAD_KEYSTORE_B64: ${{ secrets.LIRELLE_UPLOAD_KEYSTORE_B64 }}
          LIRELLE_KEYSTORE_PASSWORD: ${{ secrets.LIRELLE_UPLOAD_KEYSTORE_PASSWORD }}
          LIRELLE_KEY_ALIAS: ${{ secrets.LIRELLE_UPLOAD_KEY_ALIAS }}
          LIRELLE_KEY_PASSWORD: ${{ secrets.LIRELLE_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$LIRELLE_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export LIRELLE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew :app:bundleRelease --no-build-cache
      - name: To Google Play
        # Off until the store is set up (#27) and the first AAB is sent by hand (#28): then PLAY_PUBLISH is true.
        if: needs.release-please.outputs.release_created == 'true' && vars.PLAY_PUBLISH == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          gem install --user-install --no-document fastlane
          "$(ruby -e 'print Gem.user_dir')/bin/fastlane" supply --package_name app.tfdn.lirelle \
            --json_key "$RUNNER_TEMP/play.json" --track production --release_status completed \
            --aab app/build/outputs/bundle/release/app-release.aab --skip_upload_apk true \
            --metadata_path fastlane/metadata/android --sync_image_upload true
      - name: AAB kept for a first upload by hand
        if: needs.release-please.outputs.release_created == 'true' && vars.PLAY_PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lirelle-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Keys removed
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
