# The checks of every pull request, and of every push to main through release.yml.
name: Checks

on:
  pull_request:
  workflow_call:

# A newer push to a pull request cancels the run of the older one; on main nothing is cancelled.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: v8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Our own SDK, cached, rather than the runner's: the same packages as everywhere else.
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Hard-coded text
        run: scripts/check-hardcoded-text.sh
      - name: Secrets
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
      - name: Licences (REUSE)
        uses: fsfe/reuse-action@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: /home/runner/android-sdk
          key: android-sdk-${{ hashFiles('ci/install-android-sdk.sh', 'gradle/libs.versions.toml') }}
          restore-keys: android-sdk-
      - name: Android SDK
        run: ci/install-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: detekt, lint, unit tests
        run: ./gradlew detekt lintDebug testDebugUnitTest
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # The reader's page (feature/reader/src/main/assets/reader) in a headless browser. The image and the npm package in
  # reader-tests/ must be the same version (Renovate's group "playwright").
  reader-page:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    defaults:
      run:
        working-directory: reader-tests
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Page tests
        run: npx playwright test
        env:
          HOME: /root
      - name: Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reader-page-results
          path: reader-tests/test-results/
          retention-days: 7
