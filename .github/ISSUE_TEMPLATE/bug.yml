name: Bug report
description: Something in Lirelle does not work as it should.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please write in English, in your own words (see CONTRIBUTING).
        A question rather than a bug? Ask it in the Discussions.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What goes wrong, as you see it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From opening the app, what to do to see it.
      placeholder: |
        1. Open a book from the Library
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lirelle version
      description: Settings → About.
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 9, Android 16
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - BookOrbit
        - Komga
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: Optional. Remove anything private (addresses, names, tokens) first.
  - type: checkboxes
    id: rules
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I wrote this issue myself; it is not generated by an AI tool (see CONTRIBUTING).
          required: true
