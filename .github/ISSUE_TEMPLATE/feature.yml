name: Feature request
description: Something Lirelle could do, or do better.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Please write in English, in your own words (see CONTRIBUTING). An idea still taking shape is welcome in the
        Discussions' Ideas first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional.
  - type: checkboxes
    id: rules
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I wrote this issue myself; it is not generated by an AI tool (see CONTRIBUTING).
          required: true
